<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>QR Cards</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 10px; width: 260px; text-align: center; }
    .card img { width: 220px; height: 220px; }
    .table { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <img src="/qrcodes/table-1.png" />
    <div class="table">Table 1</div>
  </div>

  <div class="card">
    <img src="/qrcodes/table-2.png" />
    <div class="table">Table 2</div>
  </div>

  <div class="card">
    <img src="/qrcodes/table-3.png" />
    <div class="table">Table 3</div>
  </div>

</body>
</html>
